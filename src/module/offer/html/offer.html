<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Offer UI Clean</title>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial;
        }

        body {
            background: #f4f6f8;
            height: 100vh;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        /* ================= LEFT ================= */
        .left {
            width: 40%;
            background: white;
            border-right: 1px solid #ddd;
            padding: 10px;
            overflow-y: auto;
        }

        /* TOKEN (NEW DESIGN - INSIDE LEFT) */
        .token-box {
            width: 100%;
            background: #fafafa;
            border-radius: 10px;
            margin-bottom: 15px;

            display: flex;
            gap: 10px;
            align-items: center;
        }

        .token-box input {
            flex: 1;
            /* quan trọng */
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin-bottom: 0;
            /* bỏ xuống dòng */
        }

        .token-box button {
            padding: 10px 16px;
            background: black;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;

            width: auto;
            /* bỏ 100% */
            white-space: nowrap;
        }

        /* POST */
        .title {
            font-size: 26px;
            font-weight: bold;
        }

        .content {
            margin-top: 8px;
            color: #555;
        }

        .image {
            width: 100%;
            margin-top: 10px;
            border-radius: 10px;
            display: none;
        }

        .createdAt {
            margin-top: 10px;
            font-size: 12px;
            color: gray;
        }

        .highest {
            margin-top: 15px;
            font-size: 22px;
            color: green;
            font-weight: bold;
        }

        /* ================= RIGHT ================= */
        .right {
            width: 60%;
            display: flex;
            flex-direction: column;
        }

        /* JOIN */
        .join-box {
            display: flex;
            padding: 10px;
            background: white;
            border-bottom: 1px solid #ddd;
        }

        .join-box input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 10px;
        }

        .join-box button {
            margin-left: 10px;
            padding: 12px 20px;
            background: black;
            color: white;
            border: none;
            border-radius: 10px;
        }

        /* CHAT */
        .chat {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            background: #efeae2;
        }

        .msg {
            background: white;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 10px;
        }

        .me {
            background: #d9fdd3;
        }

        .price {
            color: red;
            font-weight: bold;
            font-size: 18px;
        }

        .time {
            font-size: 11px;
            color: gray;
            margin-top: 5px;
        }

        /* INPUT */
        .input-box {
            display: flex;
            padding: 10px;
            background: white;
            border-top: 1px solid #ddd;
        }

        .input-box input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 10px;
        }

        .input-box button {
            margin-left: 10px;
            padding: 12px 20px;
            background: black;
            color: white;
            border: none;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- LEFT -->
        <div class="left">

            <!-- TOKEN INSIDE POST PANEL -->
            <div class="token-box">
                <input id="tokenInput" placeholder="Enter JWT token..." />
                <button onclick="saveToken()">Save Token</button>
            </div>

            <div class="title" id="postTitle">No Post Selected</div>
            <div class="content" id="postContent"></div>

            <img id="postImage" class="image" />

            <div class="createdAt" id="createdAt"></div>

            <div class="highest" id="highestOffer">0đ</div>

        </div>

        <!-- RIGHT -->
        <div class="right">

            <div class="join-box">
                <input type="number" id="postIdInput" placeholder="Enter postId..." />
                <button onclick="joinPost()">Join</button>
            </div>

            <div class="chat" id="chatBox"></div>

            <div class="input-box">
                <input type="number" id="priceInput" placeholder="Enter price..." />
                <button onclick="sendOffer()">Send</button>
            </div>

        </div>

    </div>

    <script>

        /* ================= TOKEN ================= */
        function saveToken() {
            const token = document.getElementById("tokenInput").value;
            localStorage.setItem("token", token);
            location.reload();
        }

        const token = localStorage.getItem("token");

        /* ================= SOCKET ================= */
        const socket = io("http://localhost:3000", {
            auth: { token },
            transports: ["websocket"]
        });

        let currentPostId = null;
        let mySocketId = null;
        const seen = new Set();

        socket.on("connect", () => {
            mySocketId = socket.id;
        });

        /* ================= JOIN ================= */
        function joinPost() {
            const postId = Number(document.getElementById("postIdInput").value);
            if (!postId) return alert("Enter postId");

            currentPostId = postId;

            seen.clear();
            document.getElementById("chatBox").innerHTML = "";
            document.getElementById("highestOffer").innerText = "0đ";
            document.getElementById("postImage").style.display = "none";

            socket.emit("joinOffer", { postId });
        }

        /* ================= DATA ================= */
        socket.on("joinOffer", (data) => {

            document.getElementById("postTitle").innerText = data.name;
            document.getElementById("postContent").innerText = data.content;

            document.getElementById("createdAt").innerText =
                "Created: " + new Date(data.createAt).toLocaleString();

            if (data.images?.length) {
                const img = document.getElementById("postImage");
                img.src = data.images[0].url;
                img.style.display = "block";
            }

            renderOffers(data.offers || []);
        });

        /* ================= RENDER ================= */
        function renderOffers(offers) {
            const box = document.getElementById("chatBox");
            box.innerHTML = "";
            offers.forEach(addOffer);
        }

        /* ================= ADD ================= */
        function addOffer(o) {

            if (o.id && seen.has(o.id)) return;
            if (o.id) seen.add(o.id);

            const isMe = o.socketId === mySocketId;

            document.getElementById("chatBox").innerHTML += `
        <div class="msg ${isMe ? "me" : ""}">
        <div><b>${o.buyer?.name || "User"}</b></div>

        <div class="price">
            ${Number(o.price).toLocaleString()}đ
        </div>

        <div class="time">
            ${o.createdAt ? new Date(o.createdAt).toLocaleString() : ""}
        </div>
        </div>
    `;
        }

        /* ================= SEND ================= */
        function sendOffer() {
            const price = Number(document.getElementById("priceInput").value);

            if (!currentPostId) return alert("Join first");
            if (!price) return alert("Enter price");

            socket.emit("createOffer", {
                postId: currentPostId,
                price
            });

            document.getElementById("priceInput").value = "";
        }

    </script>

</body>

</html>
